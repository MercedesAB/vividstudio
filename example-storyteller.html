<!DOCTYPE html>
<html lang="en">
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600&family=Inter&display=swap');
body { margin: 0; font-family: 'Inter', sans-serif; background: #111; color: #fff; }
.split { display: flex; min-height: 100vh; }
.left { flex: 1; background: url('https://picsum.photos/id/1064/800/1200') center/cover; }
.right { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 50px; }
h1 { font-family: 'Syne', sans-serif; font-size: 3rem; margin-bottom: 20px; }
p { color: #ccc; margin-bottom: 30px; }
.btn { border: 1px solid #fff; color: #fff; padding: 12px 30px; text-decoration: none; display: inline-block; width: fit-content; }
.back { position: fixed; top: 20px; left: 20px; color: #fff; text-decoration: none; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
</style>
</head>
<body>
    <a href="index.html" class="back">&larr; Back</a>
    <div class="split">
        <div class="left"></div>
        <div class="right">
            <h1>The Maker's Journey</h1>
            <p>Hi, I'm Sarah. What started as a hobby in my small apartment has grown into a passionate pursuit of creating beautiful, functional art. I believe in slow living, sustainable materials, and the beauty of imperfection.</p>
            <a href="#" class="btn">Read My Story on Etsy</a>
        </div>
    </div>
</body>
</html>

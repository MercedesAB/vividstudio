<!DOCTYPE html>
<html lang="en">
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter&display=swap');
body { margin: 0; font-family: 'Inter', sans-serif; background: #E6DCCF; color: #5C4033; text-align: center; }
header { padding: 60px 20px; }
h1 { font-family: 'Playfair Display', serif; font-style: italic; font-size: 3rem; margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 40px 60px; }
img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.back { position: fixed; top: 20px; left: 20px; color: #5C4033; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
    <a href="index.html" class="back">&larr; Back to Vivid Studio</a>
    <header>
        <h1>The Gallery</h1>
        <p>A collection of past works and custom commissions.</p>
    </header>
    <div class="grid">
        <!-- Unbreakable reliable placeholder images -->
        <img src="https://picsum.photos/id/1062/500/500" alt="Gallery Image 1">
        <img src="https://picsum.photos/id/1064/500/500" alt="Gallery Image 2">
        <img src="https://picsum.photos/id/1065/500/500" alt="Gallery Image 3">
        <img src="https://picsum.photos/id/1067/500/500" alt="Gallery Image 4">
        <img src="https://picsum.photos/id/1068/500/500" alt="Gallery Image 5">
        <img src="https://picsum.photos/id/1069/500/500" alt="Gallery Image 6">
    </div>
</body>
</html>
